name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  GOFLAGS: -p=1

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
      - name: Validate release version
        id: version
        run: |
          release_tag="$(python3 tools/ci/version_check.py)"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=${release_tag#v}" >> "$GITHUB_OUTPUT"
      - name: Lint
        run: make lint
      - name: Test
        run: make test-ci
      - name: Validate reconciled files
        run: |
          make reconcile
          git diff --exit-code
      - name: Validate generated examples
        run: |
          make examples-ci
          git diff --exit-code
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          distribution: goreleaser
          version: v2.17.0
          install-only: true
      - name: Build release archives
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: goreleaser release --snapshot --clean
      - name: Validate release binary version
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          linux_binary="$(find dist -type f -path '*linux_amd64*/ariel' -print -quit)"
          test -n "$linux_binary"
          test "$("$linux_binary" version)" = "$RELEASE_TAG"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/*.tar.gz dist/*.zip dist/checksums.txt
          --target "$GITHUB_SHA"
          --title "$RELEASE_TAG"
          --generate-notes
